services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: support-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: supportai
      POSTGRES_USER: supportai
      POSTGRES_PASSWORD: supportai_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: